name: Staging Docker persistence recovery
on:
  push:
    branches: [feat/production-foundation-20261104]
  pull_request:
jobs:
  docker-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated staging secrets
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          api_key="$(openssl rand -hex 32)"
          db_password="$(openssl rand -hex 24)"
          echo "::add-mask::$api_key"
          echo "::add-mask::$db_password"
          printf 'STUDIO_API_KEY=%s\nSTUDIO_DB_PASSWORD=%s\n' "$api_key" "$db_password" > .env.staging
          chmod 600 .env.staging
          printf 'STUDIO_DB_PASSWORD=%s\n' "$db_password" >> "$GITHUB_ENV"
          unset api_key db_password
      - name: Run isolated real Docker recovery test
        shell: bash
        run: bash backend/tests/staging_docker_recovery.sh
      - name: Remove ephemeral staging containers
        if: always()
        shell: bash
        run: |
          docker compose -p bc-studio-ci-${{ github.run_id }} -f compose.staging.yml down --remove-orphans || true
          shred -u .env.staging 2>/dev/null || rm -f .env.staging

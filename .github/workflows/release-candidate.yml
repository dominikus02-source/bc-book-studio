name: Release candidate
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['bookstudio-rc-*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  image:
    outputs:
      web_digest: ${{ steps.published.outputs.web_digest }}
      migrator_digest: ${{ steps.published.outputs.migrator_digest }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bookstudio_release_ci
          POSTGRES_USER: bookstudio
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bookstudio -d bookstudio_release_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Resolve image revision
        id: rev
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime on GitHub
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ steps.rev.outputs.sha }}
          build-args: REVISION=${{ steps.rev.outputs.sha }}
          cache-from: type=gha,scope=bookstudio-runtime
          cache-to: type=gha,mode=max,scope=bookstudio-runtime
      - name: Build separate migration tooling
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          build-args: REVISION=${{ steps.rev.outputs.sha }}
          load: true
          tags: ghcr.io/${{ github.repository }}-migrator:sha-${{ steps.rev.outputs.sha }}
          cache-from: type=gha,scope=bookstudio-runtime
      - name: Test migrations and runtime image
        env:
          WEB_IMAGE: ghcr.io/${{ github.repository }}:sha-${{ steps.rev.outputs.sha }}
          MIGRATOR_IMAGE: ghcr.io/${{ github.repository }}-migrator:sha-${{ steps.rev.outputs.sha }}
        run: bash scripts/verify-release-images.sh
      - name: Publish verified image archive for VPS
        if: startsWith(github.ref, 'refs/tags/bookstudio-rc-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEB_IMAGE: ghcr.io/${{ github.repository }}:sha-${{ steps.rev.outputs.sha }}
          MIGRATOR_IMAGE: ghcr.io/${{ github.repository }}-migrator:sha-${{ steps.rev.outputs.sha }}
        run: |
          set -euo pipefail
          docker save "$WEB_IMAGE" "$MIGRATOR_IMAGE" | gzip -1 > bookstudio-images.tar.gz
          sha256sum bookstudio-images.tar.gz > bookstudio-images.tar.gz.sha256
          gh release create "$GITHUB_REF_NAME" --prerelease --title "BC Book Studio $GITHUB_SHA" --notes "Verified images. Source revision: $GITHUB_SHA. VPS deployment remains separate." bookstudio-images.tar.gz bookstudio-images.tar.gz.sha256
      - name: Authenticate package publishing
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/bookstudio-rc-') || github.head_ref == 'feat/studio-xlsx-md-form-crud-20261106'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified immutable images
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/bookstudio-rc-') || github.head_ref == 'feat/studio-xlsx-md-form-crud-20261106'
        env:
          WEB_IMAGE: ghcr.io/${{ github.repository }}:sha-${{ steps.rev.outputs.sha }}
          MIGRATOR_IMAGE: ghcr.io/${{ github.repository }}-migrator:sha-${{ steps.rev.outputs.sha }}
        id: published
        run: |
          set -euo pipefail
          docker push "$WEB_IMAGE"
          docker push "$MIGRATOR_IMAGE"
          echo "web_digest=$(docker image inspect "$WEB_IMAGE" --format '{{index .RepoDigests 0}}')" >> "$GITHUB_OUTPUT"
          echo "migrator_digest=$(docker image inspect "$MIGRATOR_IMAGE" --format '{{index .RepoDigests 0}}')" >> "$GITHUB_OUTPUT"
          {
            echo "### Verified image digests"
            docker image inspect "$WEB_IMAGE" --format '{{index .RepoDigests 0}}'
            docker image inspect "$MIGRATOR_IMAGE" --format '{{index .RepoDigests 0}}'
            echo "No VPS, DNS, Access policy or database was changed by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy verified images to VPS
    needs: image
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.BC_BOOK_STUDIO_AUTO_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    concurrency:
      group: bc-book-studio-production
      cancel-in-progress: false
    steps:
      - name: Check production deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.BC_BOOK_STUDIO_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.BC_BOOK_STUDIO_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.BC_BOOK_STUDIO_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.BC_BOOK_STUDIO_DEPLOY_KNOWN_HOSTS }}
          EXPECTED_AUD: ${{ secrets.BC_BOOK_STUDIO_EXPECTED_AUD }}
        run: |
          set -euo pipefail
          for value in "$DEPLOY_HOST" "$DEPLOY_USER" "$DEPLOY_KEY" "$KNOWN_HOSTS" "$EXPECTED_AUD"; do
            test -n "$value" || { echo "::error::Missing production deployment secret"; exit 1; }
          done
          test -n "${{ needs.image.outputs.web_digest }}"
          test -n "${{ needs.image.outputs.migrator_digest }}"
      - name: Deploy using pinned images and existing guarded VPS runbook
        env:
          DEPLOY_HOST: ${{ secrets.BC_BOOK_STUDIO_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.BC_BOOK_STUDIO_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.BC_BOOK_STUDIO_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.BC_BOOK_STUDIO_DEPLOY_KNOWN_HOSTS }}
          EXPECTED_AUD: ${{ secrets.BC_BOOK_STUDIO_EXPECTED_AUD }}
          WEB_DIGEST: ${{ needs.image.outputs.web_digest }}
          MIGRATOR_DIGEST: ${{ needs.image.outputs.migrator_digest }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/bookstudio_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/bookstudio_deploy ~/.ssh/known_hosts
          # No password authentication or host-key bypass. VPS account must have
          # access to Docker and the pre-provisioned isolated runtime directory.
          ssh -i ~/.ssh/bookstudio_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd /opt/bc-book-studio-runtime && \
             BC_BOOK_STUDIO_IMAGE='$WEB_DIGEST' \
             BC_BOOK_STUDIO_MIGRATOR_IMAGE='$MIGRATOR_DIGEST' \
             BC_BOOK_STUDIO_VERIFIED_SHA='$REVISION' \
             BC_BOOK_STUDIO_EXPECTED_AUD='$EXPECTED_AUD' \
             bash scripts/deploy-release.sh --check && \
             BC_BOOK_STUDIO_IMAGE='$WEB_DIGEST' \
             BC_BOOK_STUDIO_MIGRATOR_IMAGE='$MIGRATOR_DIGEST' \
             BC_BOOK_STUDIO_VERIFIED_SHA='$REVISION' \
             BC_BOOK_STUDIO_EXPECTED_AUD='$EXPECTED_AUD' \
             bash scripts/deploy-release.sh --apply"

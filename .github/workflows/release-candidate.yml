name: Release candidate
on:
  workflow_dispatch:
  push:
    tags: ['bookstudio-rc-*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      contents: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bookstudio_release_ci
          POSTGRES_USER: bookstudio
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bookstudio -d bookstudio_release_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime on GitHub
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha,scope=bookstudio-runtime
          cache-to: type=gha,mode=max,scope=bookstudio-runtime
      - name: Build separate migration tooling
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          build-args: REVISION=${{ github.sha }}
          load: true
          tags: ghcr.io/${{ github.repository }}-migrator:sha-${{ github.sha }}
          cache-from: type=gha,scope=bookstudio-runtime
      - name: Test migrations and runtime image
        env:
          WEB_IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          MIGRATOR_IMAGE: ghcr.io/${{ github.repository }}-migrator:sha-${{ github.sha }}
        run: bash scripts/verify-release-images.sh
      - name: Publish verified image archive for VPS
        if: startsWith(github.ref, 'refs/tags/bookstudio-rc-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEB_IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          MIGRATOR_IMAGE: ghcr.io/${{ github.repository }}-migrator:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          docker save "$WEB_IMAGE" "$MIGRATOR_IMAGE" | gzip -1 > bookstudio-images.tar.gz
          sha256sum bookstudio-images.tar.gz > bookstudio-images.tar.gz.sha256
          gh release create "$GITHUB_REF_NAME" --prerelease --title "BC Book Studio $GITHUB_SHA" --notes "Verified images. Source revision: $GITHUB_SHA. VPS deployment remains separate." bookstudio-images.tar.gz bookstudio-images.tar.gz.sha256
      - name: Authenticate package publishing
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/bookstudio-rc-')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified immutable images
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/bookstudio-rc-')
        env:
          WEB_IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          MIGRATOR_IMAGE: ghcr.io/${{ github.repository }}-migrator:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          docker push "$WEB_IMAGE"
          docker push "$MIGRATOR_IMAGE"
          {
            echo "### Verified image digests"
            docker image inspect "$WEB_IMAGE" --format '{{index .RepoDigests 0}}'
            docker image inspect "$MIGRATOR_IMAGE" --format '{{index .RepoDigests 0}}'
            echo "No VPS, DNS, Access policy or database was changed by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

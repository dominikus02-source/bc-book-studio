name: Scientific Publishing Docker CI
on:
  push:
    branches:
      - feat/scientific-publishing-toolchain-20261104
    paths:
      - 'publishing/**'
      - '.github/workflows/scientific-publishing-docker.yml'
  pull_request:
    paths:
      - 'publishing/**'
      - '.github/workflows/scientific-publishing-docker.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  science-docker-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated scientific worker
        run: docker build --progress plain -f publishing/Dockerfile.science -t bc-book-science:ci .
      - name: Imports and functionality inside container (network disabled)
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --pids-limit 64 --memory 2g --cpus 2 --tmpfs /tmp:rw,nosuid,size=256m \
            --entrypoint python bc-book-science:ci -c "import numpy,scipy,sympy,matplotlib,segno,rdkit,docx,pint,PIL,pygments,cairosvg; print('ALL_IMPORTS_OK')"
          docker run --rm --network none --read-only --cap-drop ALL \
            --pids-limit 64 --memory 2g --cpus 2 --tmpfs /tmp:rw,nosuid,size=256m \
            --entrypoint python bc-book-science:ci -m unittest discover -s /opt/bc/publishing/tests -p test_scientific_assets.py -v
  quarto-docker-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build published Quarto image
        run: docker build --progress plain -f publishing/Dockerfile -t bc-book-publishing:ci .
      - name: Verify tools in isolated container
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --tmpfs /tmp:rw,nosuid,size=256m --entrypoint quarto bc-book-publishing:ci --version
          docker run --rm --network none --read-only --cap-drop ALL \
            --tmpfs /tmp:rw,nosuid,size=256m --entrypoint python3 bc-book-publishing:ci -m unittest discover -s /opt/bc/publishing/tests -p test_qmd_pipeline.py -v
  geo-docker-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated base and optional GIS worker
        run: |
          docker build --progress plain -f publishing/Dockerfile.science -t bc-book-science:ci .
          docker build --progress plain -f publishing/Dockerfile.geo -t bc-book-geo:ci .
      - name: Verify geospatial libraries and coordinate transformation offline
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --pids-limit 64 --memory 2g --cpus 2 --tmpfs /tmp:rw,nosuid,size=256m \
            --entrypoint python bc-book-geo:ci -m unittest discover -s /opt/bc/publishing/tests -p test_geospatial.py -v

name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  npm_config_cache: ${{ runner.temp }}/bc-book-studio-ci-npm

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore CI npm downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bc-book-studio-ci-npm/_cacache
          key: bc-book-studio-ci-${{ runner.os }}-node22-npm-${{ hashFiles('package-lock.json') }}

      - name: Restore Next compiler cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache/webpack
            .next/cache/turbopack
            .next/cache/swc
          key: bc-book-studio-ci-${{ runner.os }}-node22-compiler-v2-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            bc-book-studio-ci-${{ runner.os }}-node22-compiler-v2-${{ hashFiles('package-lock.json') }}-

      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run build
      - name: Verify staging-compatible Docker build
        run: docker build --build-arg BUILD_CACHE_SCOPE=bc-book-studio-ci -t bc-book-studio:ci .

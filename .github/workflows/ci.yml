name: CI
on:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bookstudio_release_ci
          POSTGRES_USER: bookstudio
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bookstudio -d bookstudio_release_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://bookstudio:ci-only-password@127.0.0.1:5432/bookstudio_release_ci?schema=public
      APP_ORIGIN: http://127.0.0.1:3183
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:migrate
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:ai-providers
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --reporter=line
      - name: Admin user CRUD and recovery integration
        run: node tests/admin-users-e2e.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: test-results/

name: Staging CI
on:
  push:
    branches: [main, feat/staging-auth-crud]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Require lockfile
        run: test -f package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Diagnostics
        if: always()
        run: |
          node --version
          npm --version
          git status --short
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require verifier tests and Dockerfile
        run: |
          test -f verifier/Dockerfile
          test -d verifier/tests
          find verifier/tests -name 'test_*.py' | grep -q .
      - name: Build isolated verifier test image
        run: docker build --target test -t bc-verifier-test ./verifier
      - name: Run JWT tests without external network
        run: docker run --rm --network none -e CF_ACCESS_TEAM_DOMAIN=test.cloudflareaccess.com -e CF_ACCESS_AUD=local-test-audience bc-verifier-test
      - name: Diagnostics
        if: always()
        run: docker image ls bc-verifier-test || true
  prisma-migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bc_ci
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: bc_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bc_ci -d bc_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://bc_ci:ci_only_password@localhost:5432/bc_ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Strict security audit
        run: npm audit --audit-level=high
      - name: Verify dependency resolutions
        run: npm ls postcss deepmerge-ts prisma @prisma/client
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Validate schema
        run: npx prisma validate
      - name: Apply migrations to empty Postgres 16
        run: npx prisma migrate deploy
      - name: Verify migration status
        run: npx prisma migrate status
      - name: Query using generated Prisma client
        run: |
          node - <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          (async () => {
            const db = new PrismaClient();
            try {
              const rows = await db.$queryRaw`SELECT 1 AS ok`;
              if (Number(rows[0]?.ok) !== 1) throw new Error('Prisma query returned unexpected result');
              const count = await db.book.count();
              if (count !== 0) throw new Error('Expected empty Book table');
              console.log('Prisma client query and empty Book table OK');
            } finally { await db.$disconnect(); }
          })().catch(err => { console.error(err); process.exitCode = 1; });
          NODE
  caddy-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate single source of truth
        shell: bash
        run: |
          set -euo pipefail
          source ops/owner-run/config.env
          test "$CADDY_IMAGE_DIGEST" = "sha256:d44355d3c2149dc580ce2cac735955d1c08d3d00882c30489c241aa51a5c10d9"
          test "$HOST_CONFD" = "/opt/bahasacerdas/config/caddy.d"
          test "$CT_CONFD" = "/etc/caddy/conf.d"
          ! grep -Rn '/etc/caddy/caddy.d' ops/owner-run --include='*.sh'
          test "$BASELINE_COMPLETE" = false
          for script in ops/owner-run/*.sh; do bash -n "$script"; done
          for script in ops/owner-run/{02-deploy-verifier,03-caddy-snippet,99-rollback}.sh; do bash "$script" --dry-run; done
      - name: Caddy production image digest and self-signed certificate fixture
        shell: bash
        run: |
          set -euo pipefail
          source ops/owner-run/config.env
          mkdir -p fixture/conf.d/certs/bcbookstudio
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=bcbookstudio.bahasacerdas.com' -keyout fixture/conf.d/certs/bcbookstudio/tls.key -out fixture/conf.d/certs/bcbookstudio/tls.crt 2>/dev/null
          sed "s|__CERT_PATH__|$CT_CONFD/$CERT_SUBDIR|g" ops/owner-run/bcbookstudio.caddy > fixture/conf.d/bcbookstudio.caddy
          printf 'import %s/*.caddy\n' "$CT_CONFD" > fixture/Caddyfile
          docker run --rm -v "$PWD/fixture/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$PWD/fixture/conf.d:$CT_CONFD:ro" "caddy@$CADDY_IMAGE_DIGEST" caddy validate --config /etc/caddy/Caddyfile
          sed -i 's|tls.crt|missing.crt|' fixture/conf.d/bcbookstudio.caddy
          if docker run --rm -v "$PWD/fixture/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$PWD/fixture/conf.d:$CT_CONFD:ro" "caddy@$CADDY_IMAGE_DIGEST" caddy validate --config /etc/caddy/Caddyfile; then
            echo "ERROR: invalid certificate path incorrectly accepted"; exit 1
          fi
          echo "PASS: positive and negative Caddy certificate validation"
      - name: Caddy validation summary
        if: always()
        run: |
          echo "NOTE: Full production Caddyfile adaptation, routing, log leak and rollback remain BLOCKED until exact fixture and complete host baseline are verified."
  script-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck full diagnostics
        id: shellcheck_diagnostics
        run: |
          shellcheck -x -f gcc ops/owner-run/*.sh 2>&1 | tee shellcheck-findings.txt
          exit "${PIPESTATUS[0]}"
      - name: Publish ShellCheck findings
        if: always()
        run: |
          if test -f shellcheck-findings.txt; then cat shellcheck-findings.txt; else echo "ShellCheck did not produce findings"; fi
      - name: Hadolint Dockerfiles
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work hadolint/hadolint:latest hadolint Dockerfile verifier/Dockerfile
      - name: Verify staging compose configuration
        env:
          CF_ACCESS_TEAM_DOMAIN: test.cloudflareaccess.com
          CF_ACCESS_AUD: test-audience
        run: |
          set -euo pipefail
          source ops/owner-run/config.env
          export CADDY_NETWORK
          docker compose -f compose.phase1.yml config --quiet
          ! docker compose -f compose.phase1.yml config | grep -E 'published:|host_ip:'

name: Frontend Quality Gates

on:
  push:
    branches:
      - main
      - feat/frontend-agent-foundation
      - feat/production-foundation-20261104
      - feat/frontend-tooling-tailwind-staging
  pull_request:
    branches:
      - main
      - feat/frontend-agent-foundation
      - feat/production-foundation-20261104
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, unit and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Deterministic dependencies
        run: npm ci --no-audit --no-fund
      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
      - name: Ban remote runtime styles/scripts
        run: |
          if grep -R -n -E 'cdn\.tailwindcss\.com|fonts\.googleapis\.com|fonts\.gstatic\.com|<script[^>]+https?://' src; then
            echo 'Remote CDN dependency detected in frontend source' >&2
            exit 1
          fi
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - run: npm run typecheck

  responsive:
    name: Chromium viewport, keyboard, CDN and a11y
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

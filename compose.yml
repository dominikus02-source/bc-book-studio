services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://bookstudio:${DB_PASSWORD}@db:5432/bookstudio?schema=public
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bookstudio
      POSTGRES_USER: bookstudio
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - bookstudio_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U bookstudio -d bookstudio"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
volumes:
  bookstudio_pg:
